<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .header{
            text-align:left;
            height: 100px;
            width: 90vw;
            display: flex;
            background-color: #1e90ff;
            border-radius: 0.5rem;
            box-shadow: #0077ea;
            justify-content: flex-start;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            color: white;
        }
        .main{
            height: 520px;
            width: 65vw;
            background-color: #3cb371;
            border-radius: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding-top: 80px;
            padding-left: 70px;
            box-sizing: border-box;
        }
        .mid{
            display: flex;
            flex-direction: row;
            gap: 30px;
        }
        .item{
            color: white;
            text-align: center;
            padding-top: 40px;
            box-sizing: border-box;
            justify-content: center;
            align-items: flex-start;
            background-color: #2f8d59;
            border-radius: 0.5rem;
            height: 100px;
            width: 12vw;
        }
        .sidebar{
            text-align: left;
            color: white;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 0.5rem;
            justify-content: center;
            align-items: flex-end;
            background-color: #ff6347;
            height: 520px;
            width: 300px;
        }
        .footer{
            text-align: left;
            padding: 40px;
            box-sizing: border-box;
            color: white;
            align-items: center;
            height: 100px;
            width: 90vw;
            background-color:#4169e1 ;
            justify-content: flex-end;
            border-radius: 0.5rem ;
        }

    </style>
</head>
<body>
    <div class = "container">
        <div class = "top">
            <section class = "header">Header</section>
        </div>
        <div class = "mid">
            <section class = "main">
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
                <div class ="item">Item</div>
            </section>
            <section class = "sidebar">Sidebar</section>
        </div>
        <div class="bot">
            <section class = "footer">Footer</section>
        </div>
    </div>
</body>
</html>
